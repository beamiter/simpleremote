[package]
name = "simpleremote"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust transport runtime for the SimpleRemote Vim plugin"
repository = "https://github.com/beamiter/simpleremote"

[[bin]]
name = "simpleremote-daemon"
path = "src/main.rs"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = true
